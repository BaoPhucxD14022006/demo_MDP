<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minh họa thực nghiệm: Quy hoạch động trên GridWorld 4x4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="viewport">
    <div id="stage">
      <header class="stage-header">
        <div class="header-left">
          <span class="brand-dot"></span>
          <h1 class="stage-title">Minh họa thực nghiệm: Quy hoạch động trên GridWorld 4x4</h1>
        </div>
        <div class="header-right">
          <span id="mode-badge" class="mode-badge hidden"></span>
          <span id="scene-counter" class="scene-counter">Cảnh 1/6</span>
          <nav id="scene-dots" class="scene-dots" aria-label="Chọn cảnh"></nav>
        </div>
      </header>

      <main id="stage-body" class="stage-body">
        <!-- Nội dung từng cảnh được render động bởi app.js -->
      </main>

      <footer id="hint-bar" class="hint-bar">
        <span><kbd>Space</kbd> / <kbd>→</kbd> Bước tiếp</span>
        <span><kbd>←</kbd> Cảnh trước</span>
        <span><kbd>1</kbd>–<kbd>6</kbd> Chọn cảnh</span>
        <span><kbd>P</kbd> Tạm dừng/Chạy</span>
        <span><kbd>R</kbd> Chạy lại</span>
        <span><kbd>A</kbd> Tự động toàn bài</span>
        <span><kbd>M</kbd> Bật/tắt giọng đọc</span>
        <span><kbd>F</kbd> Toàn màn hình</span>
        <span><kbd>H</kbd> Ẩn thanh phím tắt</span>
      </footer>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="audio_meta.js"></script>
  <script src="app.js"></script>
</body>
</html>
